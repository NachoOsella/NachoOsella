name: Generate profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-stats.mjs

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23a9b665&color_dots=%231d2021,%233c3836,%23665c54,%23d8a657,%23a9b665

      - name: Match snake height to stats card
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dist/github-contribution-grid-snake-dark.svg")
          svg = path.read_text()
          svg = svg.replace(
              '<svg viewBox=',
              '<svg preserveAspectRatio="none" viewBox=',
              1,
          )
          path.write_text(svg)
          PY

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
